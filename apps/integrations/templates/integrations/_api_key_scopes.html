<fieldset class="plain-fieldset pf-scopes">
  <legend class="lbl">What it can read</legend>
  <input type="hidden" name="scopes_present" value="1">
  <label class="check"><input type="checkbox" name="scopes" value="shipments:read" checked><span>Shipments<span class="sub">List shipments, and one with its totals and issues</span></span></label>
  <label class="check"><input type="checkbox" name="scopes" value="documents:read" checked><span>Documents<span class="sub">Documents and every value read from them</span></span></label>
  <label class="check"><input type="checkbox" name="scopes" value="exports:read" checked><span>Exports<span class="sub">Shipment, document and issue files (CSV or Excel)</span></span></label>
  <p class="hint">Read and upload access also lets the key upload documents. Untick what an integration doesn't need.</p>
</fieldset>
